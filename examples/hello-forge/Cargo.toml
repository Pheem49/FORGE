[package]
name = "hello-forge"
version.workspace = true
edition.workspace = true
publish = false

[features]
default = ["webview"]
webview = ["forge/webview", "forge/dev-tools", "forge/plugins"]
cef = ["forge/cef", "forge/dev-tools", "forge/plugins"]

[dependencies]
forge = { package = "forge-app", path = "../../crates/forge", default-features = false, features = ["plugins"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true

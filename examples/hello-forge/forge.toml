[app]
name = "hello-forge"
version = "0.4.0"
description = "FORGE v0.4 Dual-Engine Desktop Workbench"
identifier = "dev.forge.hello"
assets = "ui"
schemes = ["hello-forge"]

[window]
title = "FORGE Workbench"
width = 1000
height = 700
min_width = 700
min_height = 500
resizable = true
decorations = true
devtools = true

[runtime]
default = "webview"

[permissions]
mode = "enforce"
allow = [
  "host.status",
  "bench.*",
  "dialog.*",
  "clipboard.*",
  "notification.*",
  "fs.*",
  "opener.*",
  "deep_link.*",
  "window.*",
  "event.*",
]

[app]
name = "hello-forge"
version = "0.3.0"
description = "FORGE v0.3 Multi-Window, Capability-Protected & Dual-Engine Workbench"
identifier = "dev.forge.hello"
assets = "ui"

[window]
title = "FORGE Workbench"
width = 1000
height = 700
min_width = 700
min_height = 500
resizable = true
decorations = true
devtools = true

[runtime]
default = "webview"

[permissions]
mode = "enforce"
allow = [
  "host.status",
  "bench.*",
  "dialog.*",
  "clipboard.*",
  "notification.*",
  "fs.*",
  "window.*",
  "event.*",
]

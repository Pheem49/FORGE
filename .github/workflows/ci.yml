name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI & Packaging Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            patchelf \
            xvfb
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Run Clippy (Default & Full Features)
        run: |
          cargo clippy --workspace --all-targets -- -D warnings
          cargo clippy --workspace --all-targets --features forge-app/plugins,forge-app/desktop-ui -- -D warnings
      - name: Run Headless & CLI E2E Tests (Default & Full Plugins)
        run: |
          cargo test --workspace
          cargo test --workspace --features forge-app/plugins,forge-app/desktop-ui
      - name: Type-check all feature combinations (WebView + CEF + Plugins + Desktop UI)
        run: cargo check -p forge-app --features webview,cef,cef/dox,plugins,dev-tools,desktop-ui

  smoke-linux:
    name: Live Window Smoke Test (Linux Xvfb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux WebView & Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            xvfb
      - name: Build hello-forge & forge-app-cli
        run: cargo build -p forge-app-cli -p hello-forge
      - name: Launch real GTK/WebKit2GTK window and verify IPC round-trip
        run: FORGE_SMOKE_TEST=1 xvfb-run -a ./target/debug/forge dev --manifest-path examples/hello-forge/forge.toml --runtime webview
      - name: Package release bundle and smoke-test extracted binary under Xvfb
        run: |
          ./target/debug/forge build --manifest-path examples/hello-forge/forge.toml --runtime webview --format tarball --out-dir /tmp/ci-dist
          FORGE_SMOKE_TEST=1 xvfb-run -a /tmp/ci-dist/hello-forge/hello-forge

  templates:
    name: Template Verification (${{ matrix.template }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        template: [react, vue, svelte]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux WebView headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev
      - name: Scaffold, build frontend, and check Rust host
        run: |
          cargo run -p forge-app-cli -- new /tmp/tmpl-${{ matrix.template }} --template ${{ matrix.template }}
          cd /tmp/tmpl-${{ matrix.template }}
          npm install
          npm run build
          cargo check

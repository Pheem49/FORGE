name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish-dry-run:
    name: crates.io Dry-Run Verification
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux GUI headers
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev
      - name: Dry-run package forge-app
        run: cargo publish --dry-run -p forge-app
      - name: Verify forge-app-cli package file manifest
        run: cargo package --list -p forge-app-cli --allow-dirty

  bundle-release:
    name: Build Release Bundles (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            artifact_prefix: linux-x86_64
          - os: windows-latest
            artifact_prefix: windows-x86_64
          - os: macos-latest
            artifact_prefix: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            patchelf \
            dpkg-dev
      - name: Build forge-app-cli and package reference workbench
        run: |
          cargo build --release -p forge-app-cli
          cargo run --release -p forge-app-cli -- build \
            --manifest-path examples/hello-forge/forge.toml \
            --runtime webview \
            --format all \
            --out-dir release-dist/${{ matrix.artifact_prefix }}
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forge-${{ matrix.artifact_prefix }}
          path: |
            release-dist/${{ matrix.artifact_prefix }}/*.*
            release-dist/${{ matrix.artifact_prefix }}/SHA256SUMS
      - name: Attach bundles to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-dist/${{ matrix.artifact_prefix }}/*.*
            release-dist/${{ matrix.artifact_prefix }}/SHA256SUMS

[workspace]
resolver = "3"
members = [
    "crates/forge",
    "crates/forge-cli",
    "examples/hello-forge",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
arboard = "3.7.0"
cef = "156.7.0"
clap = { version = "4.6.10", features = ["derive"] }
dirs = "7.0.0"
download-cef = "3.0.1"
fd-lock = "4.0.4"
flate2 = "1.1.11"
getrandom = "0.4.3"
http = "1.5.0"
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
muda = "0.22.0"
notify = "9.0.0"
notify-rust = "4.19.0"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.2"
tao = "0.38.0"
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros", "time"] }
toml = "1.2.3"
tray-icon = "0.27.0"
ureq = "3.5.2"
wry = { version = "0.58.1", features = ["devtools", "linux-body"] }
zip = { version = "9.8.2", default-features = false, features = ["deflate"] }

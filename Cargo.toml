[workspace]
resolver = "3"
members = [
    "crates/forge",
    "crates/forge-cli",
    "examples/hello-forge",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
cef = "156.7.0"
clap = { version = "4.6.10", features = ["derive"] }
dirs = "7.0.0"
download-cef = "3.0.1"
getrandom = "0.4.3"
http = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
tao = "0.38.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "macros", "time"] }
toml = "1.2.3"
wry = { version = "0.58.1", features = ["devtools", "linux-body"] }

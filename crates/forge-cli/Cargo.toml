[package]
name = "forge-cli"
description = "Project generator, live dev runner, doctor, and cross-OS desktop bundler CLI for the FORGE platform."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["desktop", "gui", "bundler", "cef", "webview"]
categories = ["command-line-utilities", "development-tools::build-utils"]

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
clap.workspace = true
dirs.workspace = true
download-cef.workspace = true
flate2.workspace = true
forge = { package = "forge-app", path = "../forge", version = "0.3.0", default-features = false }
image.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
toml.workspace = true
zip.workspace = true

[dev-dependencies]
tempfile.workspace = true

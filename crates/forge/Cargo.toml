[package]
name = "forge-app"
description = "Rust-first desktop application platform supporting OS WebView (WRY) and Chromium (CEF) behind a single deep interface."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["desktop", "gui", "webview", "cef", "chromium"]
categories = ["gui", "web-programming"]
exclude = ["/target", "/dist"]

[lib]
name = "forge"
path = "src/lib.rs"

[features]
default = ["webview", "dev-tools"]
webview = ["dep:tao", "dep:wry", "dep:dirs"]
cef = ["dep:cef", "dep:dirs"]
dev-tools = ["dep:notify", "dep:ureq"]
desktop-ui = ["dep:tray-icon", "dep:muda", "dep:image"]
plugin-dialog = ["dep:rfd"]
plugin-clipboard = ["dep:arboard"]
plugin-notification = ["dep:notify-rust"]
plugin-fs = ["dep:dirs"]
plugin-opener = []
plugin-deep-link = []
plugin-shortcut = ["dep:global-hotkey"]
plugin-updater = [
    "dep:base64",
    "dep:dirs",
    "dep:ed25519-dalek",
    "dep:semver",
    "dep:sha2",
    "dep:ureq",
]
plugins = [
    "plugin-dialog",
    "plugin-clipboard",
    "plugin-notification",
    "plugin-fs",
    "plugin-opener",
    "plugin-deep-link",
    "plugin-shortcut",
    "plugin-updater",
]

[dependencies]
arboard = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
cef = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
fd-lock.workspace = true
flate2.workspace = true
getrandom.workspace = true
global-hotkey = { workspace = true, optional = true }
http.workspace = true
image = { workspace = true, optional = true }
muda = { workspace = true, optional = true }
notify = { workspace = true, optional = true }
notify-rust = { workspace = true, optional = true }
rfd = { workspace = true, optional = true }
semver = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
tao = { workspace = true, optional = true }
tar.workspace = true
tokio.workspace = true
toml.workspace = true
tray-icon = { workspace = true, optional = true }
ureq = { workspace = true, optional = true }
wry = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
